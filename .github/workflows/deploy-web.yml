# Build and deploy the web app to Cloudflare Workers.
#
# The build runs here rather than on the host on purpose. Netlify's free plan
# meters builds -- roughly 4.5 credits each against 300 a month -- and this
# project exhausted them in ten days of ordinary development, after which
# production deploys were skipped while merges still reported success. Nothing
# announced it. GitHub Actions is free and unmetered for a public repository,
# and Cloudflare meters requests rather than deploys, so that failure mode has
# nowhere to come back from.
name: Deploy web

# `main` is what ships, as of this change.
#
# It used to be `develop`, which meant every merged pull request went to
# eraya.app immediately and no branch existed that could be looked at before it
# was already live. Work lands on `develop` and `main` is the release, so
# promoting one to the other is now a deliberate act rather than a side effect
# of merging a feature.
on:
  push:
    branches: [main]
    # Only when something that affects the deployed app changes. Docs and the
    # mobile app share this repository and have no business spending a deploy.
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# One deploy at a time, and never cancel one midway: a half-applied Worker is
# worse than a queued one.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node the app is developed against. A floating runtime
          # is a build that breaks on a day nobody changed anything.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and deploy
        run: npm run cf:deploy --workspace @eraya/web
        env:
          # NEXT_PUBLIC_* are inlined into the browser bundle at build time, so
          # they must exist here rather than at runtime. Both are public by
          # design: the URL names the project and the publishable key is what
          # Row Level Security is there to make safe.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://eraya.app

          # The MSG91 OTP widget, which verifies phone numbers on the web.
          #
          # Both are public by design -- they name the widget and neither can
          # verify anybody; the auth key that does is a Supabase function
          # secret and is not here. They are still required at build time,
          # because Next inlines NEXT_PUBLIC_* into the browser bundle, and a
          # build without them produces a phone screen that refuses every
          # number. Phone verification gates onboarding, so that is a closed
          # front door rather than a degraded feature.
          #
          # This is exactly what happened on the first automated deploy after
          # the widget shipped: the build succeeded, the variables were absent,
          # and the deployed app could not verify anyone.
          NEXT_PUBLIC_MSG91_WIDGET_ID: ${{ secrets.NEXT_PUBLIC_MSG91_WIDGET_ID }}
          NEXT_PUBLIC_MSG91_TOKEN_AUTH: ${{ secrets.NEXT_PUBLIC_MSG91_TOKEN_AUTH }}

          # Launch day, thrown. This one switch releases both the `robots`
          # meta tag in the root layout and the X-Robots-Tag header in
          # next.config.ts -- they read the same variable, so they cannot
          # disagree. Only the literal string "true" counts.
          #
          # It belongs here and nowhere else. This workflow runs on pushes to
          # `main` only, so the production build is the only one that ever
          # sees it; local development, previews, branch builds and forks
          # leave it unset and stay noindex by default. The signed-in area
          # declares its own noindex regardless, so member profiles do not
          # become public along with the landing page.
          NEXT_PUBLIC_ALLOW_INDEXING: "true"

          # The server-side Supabase credential. Present at build because a
          # route rendered during the build would otherwise fail on a missing
          # key; the deployed Worker reads it from `wrangler secret`, not from
          # here.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
