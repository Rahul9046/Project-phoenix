# Deployment settings for the Eraya web app at eraya.app.
#
# Netlify rather than Vercel for one reason: Vercel's Hobby plan forbids
# commercial use and names processing payments as an example of it, so a free
# Vercel deployment of a product that sells Premium would be a terms violation
# from day one. Netlify's free plan permits commercial use within its quota.
#
# This file describes the build only. Environment variables are set in the
# Netlify UI and never here -- SUPABASE_SECRET_KEY in particular is a
# server-side credential that bypasses row level security, and a value in this
# file is a value in the repository.
#
# The app is dynamic on nearly every route and ships middleware, so it needs a
# real runtime. The Next.js runtime Netlify applies automatically handles that;
# there is no adapter and no export step.

[build]
  # Run from the repository root so the npm workspace resolves. `base` is left
  # unset on purpose: setting it to apps/web would hide the root package-lock
  # and the workspace would install as an unrelated project.
  command = "npm run build --workspace @eraya/web"
  publish = "apps/web/.next"

[build.environment]
  # Match the Node the app is developed against. Netlify's default floats, and
  # a floating runtime is a build that breaks on a day nobody changed anything.
  NODE_VERSION = "22"

# Security headers. The app sets no CSP of its own yet; these are the cheap
# ones that need no per-page thought and cannot break a render.
[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # The product is pre-launch and must not be indexed. This is a second lock
    # on the same door as NEXT_PUBLIC_ALLOW_INDEXING, which gates the `robots`
    # meta tag in the root layout: a header covers responses a crawler may see
    # without parsing HTML. Remove BOTH on launch day, not one.
    X-Robots-Tag = "noindex, nofollow"
