# Supabase CLI configuration.
#
# `project_id` names the *local* Docker stack only — it is not the hosted
# project reference. Linking to the hosted project is done with
#   supabase link --project-ref <ref>
# which stores the ref in supabase/.temp/ (git-ignored).

project_id = "eraya"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Local inbox for magic links and OTP emails during development.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# Eraya has no passwords: members receive a link or a code.
enable_confirmations = true

# Phone auth stays off until an SMS provider is chosen. The application mocks
# this step; see lib/auth/phone-verification.ts.
[auth.sms]
enable_signup = false
enable_confirmations = false

# OAuth providers. Secrets are read from the environment, never written here.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[auth.external.facebook]
enabled = true
client_id = "env(SUPABASE_AUTH_FACEBOOK_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_FACEBOOK_SECRET)"
