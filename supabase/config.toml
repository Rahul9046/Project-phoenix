# Supabase CLI configuration.
#
# `project_id` names the *local* Docker stack only — it is not the hosted
# project reference. Linking to the hosted project is done with
#   supabase link --project-ref <ref>
# which stores the ref in supabase/.temp/ (git-ignored).

project_id = "eraya"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Local inbox for magic links and OTP emails during development.
# The local mail catcher, used by `supabase start`. Renamed from [inbucket],
# which the CLI now warns is deprecated. Local only -- it has no bearing on the
# linked project, which sends through Resend.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
#
# The deployed web app, not a developer's machine. This is where a link in a
# sign-in email points when nothing else is specified, so it must be an address
# a member can actually reach -- `localhost` in this field means every email
# sent to anybody but the person who triggered it leads nowhere.
#
# Local development still works: `http://localhost:3000/auth/...` is listed
# below, and the client sends its own redirect address with each request.
site_url = "https://eraya.app"
# Every address an auth redirect may land on. Anything not listed here comes back
# as an error rather than a session, which is the single most common reason a
# working OAuth setup appears broken.
#
# `eraya://auth` is the mobile app's own scheme, used by a development build and
# by anything shipped to a store. `http://localhost:8081` is the `expo start
# --web` preview used for inspecting layouts.
#
# There is deliberately no `exp://` entry. Supabase refuses that scheme -- a
# literal URL is rejected as firmly as a wildcard -- and it is right to: `exp://`
# belongs to Expo Go, which every Expo project on the device shares, so a session
# delivered there could be picked up by another app. The consequence is that
# sign-in cannot complete inside Expo Go; a development build registers the
# `eraya` scheme and works normally. See docs/MOBILE_SETUP.md.
additional_redirect_urls = [
  "https://eraya.app/auth/callback",
  "https://eraya.app/auth/confirm",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
  "eraya://auth",
  "http://localhost:8081",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# How many sign-in emails may be sent, and how often one person may ask.
#
# In this file rather than only in the dashboard, which is where it lived until
# 2026-09-24 -- unreviewable, unrestorable, and unreadable without opening a
# browser. The value it replaced could not be recovered: it was overwritten
# before anyone wrote it down, which is the argument for this section in one
# sentence.
#
# `email_sent` is account-wide and hourly, not per member. Supabase's default
# alongside custom SMTP is 30, which is the wrong shape for a beta: monthly
# volume is a non-issue at a couple of sign-ins a day, but testers invited
# together arrive together, and the people a shared hourly cap turns away are
# the new ones, on their first contact with the product. 200 absorbs a batch of
# a hundred and fifty with room for their retries, and still stops a script
# long before a spam run could damage the sending domain -- which is the cost
# that matters, because Resend suspending eraya.app ends sign-in for everybody
# and is not fixed by paying.
#
# See docs/12-email-delivery.md for the evidence, the costing and the four
# things it could not establish.
[auth.rate_limit]
email_sent = 200

[auth.email]
enable_signup = true
# Eraya has no passwords: members receive a link or a code.
enable_confirmations = true
# The gap between two emails to the same address. The default, stated out loud,
# because this is the limit that stops one member spending the account-wide
# budget above -- the phone flow's 60-second cooldown by another name. The web
# sign-in form enforces the same minute in the browser as a courtesy; this is
# the one that is actually enforced.
max_frequency = "1m"

# Custom SMTP.
#
# Not optional for Eraya, and not only about deliverability. Supabase's built-in
# email service delivers solely to addresses belonging to members of the project,
# caps sending at two messages an hour, AND refuses template customisation
# entirely -- "Email template modification is not available for free tier
# projects using the default email provider". Configuring SMTP lifts all three at
# once, on the free plan.
#
# Sent from no-reply@, because this mailbox is not read. The address that IS read
# is named in the body of the email, so a reply is never silently lost.
#
# Credentials come from the environment. Nothing secret is written here.
[auth.email.smtp]
enabled = true
host = "env(SUPABASE_SMTP_HOST)"
port = 587
user = "env(SUPABASE_SMTP_USER)"
pass = "env(SUPABASE_SMTP_PASS)"
admin_email = "no-reply@eraya.app"
sender_name = "Eraya"

# The sign-in email, kept in version control rather than edited in the dashboard.
# Same reasoning as the migrations: a template that exists in one project only
# cannot be reviewed, reproduced or rolled back, and this is the first thing a
# new member sees of Eraya.
#
# The link deliberately targets /auth/confirm with a token_hash instead of
# Supabase's own verify endpoint. The default template returns a PKCE code, which
# needs a verifier cookie from the browser that requested the link -- so a link
# requested on a laptop and opened on a phone fails. token_hash works anywhere.
[auth.email.template.magic_link]
subject = "Your Eraya sign-in link"
content_path = "./supabase/templates/magic-link.html"

# Sent when an address signs up for the first time. Supabase uses this rather
# than the magic link template on first contact, so leaving it as the default
# would mean a new member sees stock wording and a returning one sees Eraya's.
[auth.email.template.confirmation]
subject = "Confirm your email for Eraya"
content_path = "./supabase/templates/magic-link.html"

# Phone auth stays off, and now stays off deliberately rather than for want of a
# provider.
#
# Eraya verifies phone numbers through MSG91, in the `phone-otp-request` and
# `phone-otp-verify` edge functions -- but a verified number is an attribute of
# an account that already exists, never a way to sign in. Turning Supabase's
# phone auth on would create a second identity for the same person, which is the
# one thing the architecture is arranged to avoid: Supabase is the identity
# authority and the number hangs off it.
#
# The MSG91 credentials are edge function secrets, not config here:
#   supabase secrets set MSG91_AUTH_KEY=... MSG91_TEMPLATE_ID=...
[auth.sms]
enable_signup = false
enable_confirmations = false

# OAuth providers. Secrets are read from the environment, never written here.
#
# All three are OFF until real credentials exist, and that is not a placeholder
# -- it is load-bearing. `lib/data/auth-settings.ts` asks the live project which
# providers are configured and renders only those buttons, because
# signInWithOAuth does not fail on a disabled provider: it navigates to Supabase,
# which answers with raw JSON as a page, stranding someone outside the site with
# no error handler able to run.
#
# Enabling one here without a client_id would therefore put a button on the login
# screen that breaks. Register the OAuth app first, set the environment
# variables, then flip `enabled` to true and run `supabase config push`.
# Live. Credentials are in .env.local and read through env() below; nothing
# secret is written here.
#
# Apple stays off until its credentials exist. Enabling a provider without a
# client id puts a button on the login screen that leads to a raw JSON error
# page -- see lib/data/auth-settings.ts.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

# Off until the Meta app is Live, which needs Business Verification and App
# Review of the `email` permission.
#
# It was `true` with a comment saying a non-tester "is refused by Facebook, not
# by Eraya", on the reasoning that the refusal is honest and belongs to whoever
# caused it. The 22-24 November signups settled that argument with evidence:
# three people pressed the button, none reached Facebook's consent screen, and
# `auth.identities` has never held a single Facebook identity. Two recovered by
# trying Google or email within a minute. One did not come back at all.
#
# A button that has never worked for anybody is not an honest refusal, it is a
# dead end on the first screen of the product -- and the one place where the
# person has no account yet, no history here, and no reason to persist.
#
# Turning it off is the whole fix on this side: the web reads the real setting
# from `/auth/v1/settings` (see features/auth/settings.ts) and stops offering it
# with no deploy at all, and the app now reads the same setting instead of
# hardcoding its list. Flip this back to `true` and run `npm run config:push`
# the day Meta approves -- nothing else has to change.
#
# Credentials are left in place. They are correct: Supabase builds a valid
# dialog URL and Facebook recognises the app ID. What is missing is Meta's
# approval, not configuration.
[auth.external.facebook]
enabled = false
client_id = "env(SUPABASE_AUTH_FACEBOOK_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_FACEBOOK_SECRET)"

# This does NOT mean production has no Storage. It does.
#
# The first line here used to read "Storage is off, matching the project", and
# both halves of that were wrong by 2026-09. Production has two buckets --
# `profile-photos` (private) and `brand` (public) -- created by
# 20260830160200 and 20260905100100, holding 46 member photographs as of
# 2026-11-27. Profile photos arrived; this comment never caught up, and the
# stale version was read in Stage 4C as evidence that a `config push` might
# switch production Storage off.
#
# It will not. What this flag does:
#
#   * LOCALLY it decides whether `supabase start` runs the storage container.
#     False means it does not, which is why a local stack cannot apply
#     20260905100100 -- that migration inserts into `storage.buckets`, and the
#     schema is created by the storage service on boot. See
#     docs/18-local-validation.md for the bootstrap that works around it.
#
#   * ON PUSH it tells the CLI not to manage this section. That is the whole
#     reason the line exists: it was added by b784553, "make config push exit
#     clean", because with storage enabled the CLI tried to configure vector
#     buckets and the free tier answered 402 -- so every push failed for a
#     reason unrelated to what was being pushed.
#
# The evidence that it is harmless is three months of it: this line has been
# here since 2026-08-29, at least four config pushes have gone out since
# (Google sign-in, Facebook on, the email rate limit, Facebook off), and
# production Storage has been enabled and serving photographs throughout.
#
# So leave it false. Setting it true would restore the 402 and break
# `npm run config:push` without changing anything about production.
[storage]
enabled = false

# ---------------------------------------------------------------------------
# Edge functions
# ---------------------------------------------------------------------------
#
# These sections are read by `supabase functions deploy`, not by
# `supabase config push`. Deploying is what applies them, so a change here
# takes effect on the next deploy of the named function and not before.
#
# This block exists because the webhook's exemption used to live in a sentence
# in docs/10-payments.md and in whoever remembered it. `supabase functions
# deploy payments-webhook` without `--no-verify-jwt` applies the default, turns
# verification back on, and Razorpay's deliveries start coming back 401 -- at
# which point the only thing still settling a payment is a client happening to
# return and reconcile. A successful-looking deploy that breaks payments
# invisibly, which is the same trap `npm run config:push` exists to prevent for
# the auth config. Written down, a plain deploy now does the right thing.

# Razorpay holds no Supabase session and never will, so there is no JWT to
# verify. Its signature is the authentication: `payments-webhook` recomputes an
# HMAC-SHA256 over the raw request bytes against RAZORPAY_WEBHOOK_SECRET,
# compares it in constant time, and rejects before parsing anything. Turning
# this to `true` does not add a layer -- it removes the only caller.
[functions.payments-webhook]
verify_jwt = false

# The other two are called by a signed-in client through `functions.invoke`,
# which sends the member's token, and they need it: an order must belong to
# somebody. Stated rather than left to the default, so the contrast with the
# webhook above is a decision on the page instead of an omission.
[functions.payments-create-order]
verify_jwt = true

[functions.payments-verify]
verify_jwt = true
